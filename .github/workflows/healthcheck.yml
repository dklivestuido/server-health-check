name: Server Health Check CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n scripts/healthcheck.sh

      - name: Check script is executable
        run: test -x scripts/healthcheck.sh

      - name: Run health check script
        run: bash scripts/healthcheck.sh
